# ------------------------------------------------------------------
# Profile workflow
# Rebuilds the live images used in README.md and publishes them to
# the "output" branch, where the README loads them from:
#   • badges.svg         → profile views · followers · stars
#   • stats.svg          → "By the numbers" card
#   • contributions.svg  → Pac-Man maze game on my contribution graph
# ------------------------------------------------------------------
name: Update profile stats

# When it runs
on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  push:
    branches: [main]      # every time something is committed to main

jobs:
  generate:
    permissions:
      contents: write     # needed to push to the "output" branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. Get the repo files (script + fonts)
      - uses: actions/checkout@v4

      # 2. Pac-Man maze game (real ghost AI) from my contribution calendar → dist/
      - name: Generate Pac-Man maze game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # 3. Read live numbers and draw badges, stats card and the contributions card
      #    (the Pac-Man game above is recoloured red and placed inside that card)
      - name: Generate badges, stats card and contributions card
        run: python3 scripts/stats.py
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. Publish everything in dist/ to the "output" branch
      - name: Push images to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
